[package]
name = "src_tauri"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
dotenvy = "0.15"
anyhow = "1"
serde_json = "1"

# Tauri with only minimal required features, no "api-all"
tauri = { version = "1", features = [
    "shell-open", 
    "protocol-asset", 
    "window-create", 
    "dialog-open"
] }

[features]
# Tauri CLI passes `--features custom-protocol` when bundling.
# This wires that feature to Tauri's own `custom-protocol` feature.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = "1"