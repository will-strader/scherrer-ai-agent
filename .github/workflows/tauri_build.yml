name: Windows Tauri Build

on:
  workflow_dispatch:

jobs:
  build-tauri-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: No Node frontend (skip npm)
        run: echo "Building a Rust-only Tauri app; skipping npm steps."

      - name: Build backend exe (PyInstaller)
        shell: cmd
        run: |
          echo CWD is %CD%
          py -3 -m pip install --upgrade pip
          py -3 -m pip install -r backend/requirements.txt
          py -3 -m pip install pyinstaller

          REM Ensure a minimal non-secret backend .env exists (real secrets are injected at runtime)
          IF NOT EXIST backend\.env (
            echo OPENAI_API_KEY= > backend\.env
            echo MODEL_NAME=gpt-4o-mini>> backend\.env
            echo MODEL_TEMPERATURE=0.30>> backend\.env
          )

          REM Build ONEDIR so the EXE is at dist\scherrer-bid-backend\scherrer-bid-backend.exe
          py -3 -m PyInstaller --noconfirm --onedir --name scherrer-bid-backend backend\run_backend.py

          dir /b dist

      - name: Copy backend exe into Tauri bundle resources
        shell: cmd
        run: |
          IF NOT EXIST src_tauri\src-tauri\resources mkdir src_tauri\src-tauri\resources
          copy /Y dist\scherrer-bid-backend\scherrer-bid-backend.exe src_tauri\src-tauri\resources\scherrer-bid-backend.exe
          dir src_tauri\src-tauri\resources

      - name: Install Windows bundlers (NSIS and WiX)
        shell: powershell
        continue-on-error: true
        run: |
          choco list --local-only

          # Install/upgrade NSIS
          choco upgrade nsis -y --no-progress

          # Try to install WiX 3.11.2; if it fails because it's already installed, upgrade instead
          choco install wixtoolset --version=3.11.2 -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            Write-Host "WiX install failed or newer version already installed. Attempting upgrade..."
            choco upgrade wixtoolset -y --no-progress
            $global:LASTEXITCODE = 0
          }

      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --locked --version "^2.0.0"

      - name: Build Tauri app (Rust-only)
        working-directory: src_tauri
        shell: bash
        run: |
          cargo tauri build --config tauri.conf.json --verbose

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scherrer-tauri-windows
          path: |
            src_tauri/target/release/bundle/msi/*.msi
            src_tauri/target/release/bundle/nsis/*.exe