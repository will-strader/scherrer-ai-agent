name: Windows Tauri Build

on:
  workflow_dispatch:

jobs:
  build-tauri-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: No Node frontend (skip npm)
        run: echo "Building a Rust-only Tauri app; skipping npm steps."

      - name: Build backend exe (PyInstaller)
        shell: cmd
        run: |
          echo CWD is %CD%
          py -3 -m pip install --upgrade pip
          py -3 -m pip install -r backend/requirements.txt
          py -3 -m pip install pyinstaller

          REM Ensure a minimal non-secret backend .env exists (real secrets are injected at runtime)
          IF NOT EXIST backend\.env (
            echo OPENAI_API_KEY= > backend\.env
            echo MODEL_NAME=gpt-4o-mini>> backend\.env
            echo MODEL_TEMPERATURE=0.30>> backend\.env
          )

          REM Build ONEDIR so the EXE is at dist\scherrer-bid-backend\scherrer-bid-backend.exe
          py -3 -m PyInstaller --noconfirm --onedir --name scherrer-bid-backend backend\run_backend.py

          dir /b dist

      - name: Copy backend exe into Tauri bundle resources
        shell: cmd
        run: |
          IF NOT EXIST frontend\src_tauri\resources mkdir frontend\src_tauri\resources
          copy /Y dist\scherrer-bid-backend\scherrer-bid-backend.exe frontend\src_tauri\resources\scherrer-bid-backend-x86_64-pc-windows-msvc.exe
          dir frontend\src_tauri\resources

      - name: Install Windows bundlers (NSIS and WiX)
        shell: powershell
        continue-on-error: true
        run: |
          choco list --local-only

          # Install/upgrade NSIS
          choco upgrade nsis -y --no-progress

          # Try to install WiX 3.11.2; if it fails because it's already installed, upgrade instead
          choco install wixtoolset --version=3.11.2 -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            Write-Host "WiX install failed or newer version already installed. Attempting upgrade..."
            choco upgrade wixtoolset -y --no-progress
            $global:LASTEXITCODE = 0
          }

      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --locked --version "^1.5.0"

      - name: Ensure Windows icon exists (icons/icon.ico)
        working-directory: frontend/src_tauri
        shell: bash
        run: |
          if [ ! -f icons/icon.ico ]; then
            mkdir -p icons
            python -c "import base64,struct,pathlib; png=base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+X3bQAAAAASUVORK5CYII='); icondir=struct.pack('<HHH',0,1,1); width=1; height=1; colorcount=0; reserved=0; planes=1; bitcount=32; bytes_in_res=len(png); image_offset=6+16; entry=struct.pack('<BBBBHHII',width,height,colorcount,reserved,planes,bitcount,bytes_in_res,image_offset); ico=icondir+entry+png; pathlib.Path('icons/icon.ico').write_bytes(ico); print('Wrote icons/icon.ico')"
          fi

          ls -la icons || true

      - name: Ensure frontend dist assets exist
        shell: bash
        run: |
          mkdir -p frontend/dist
          if [ ! -f frontend/dist/index.html ]; then
            if [ -f frontend/index.html ]; then
              cp frontend/index.html frontend/dist/index.html
            else
              printf '%s\n' \
                '<!doctype html>' \
                '<html lang="en">' \
                '  <head>' \
                '    <meta charset="utf-8" />' \
                '    <meta name="viewport" content="width=device-width, initial-scale=1" />' \
                '    <title>Scherrer AI Agent</title>' \
                '  </head>' \
                '  <body>' \
                '    <h1>Scherrer AI Agent</h1>' \
                '  </body>' \
                '</html>' \
                > frontend/dist/index.html
            fi
          fi
          ls -la frontend/dist

      - name: Patch tauri.conf.json for CI (distDir + sidecar)
        shell: bash
        run: |
          python -c "import json,pathlib; p=pathlib.Path('frontend/src_tauri/tauri.conf.json'); d=json.loads(p.read_text(encoding='utf-8')); d.setdefault('build',{}); d['build']['distDir']='../dist'; d['build']['devPath']='../dist/index.html'; t=d.setdefault('tauri',{}); b=t.setdefault('bundle',{}); b['resources']=[r for r in b.get('resources',[]) if not (isinstance(r,str) and 'scherrer-bid-backend' in r)] + ['resources/scherrer-bid-backend-x86_64-pc-windows-msvc.exe']; b['externalBin']=['resources/scherrer-bid-backend']; p.write_text(json.dumps(d,indent=2),encoding='utf-8'); print('Patched tauri.conf.json')"

      - name: Build Tauri app (Rust-only)
        working-directory: frontend/src_tauri
        shell: bash
        run: |
          cargo tauri build --verbose

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scherrer-tauri-windows
          path: |
            frontend/src_tauri/target/release/bundle/msi/*.msi
            frontend/src_tauri/target/release/bundle/nsis/*.exe