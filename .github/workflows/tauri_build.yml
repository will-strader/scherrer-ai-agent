name: Windows Tauri Build

on:
  workflow_dispatch:

jobs:
  build-tauri-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: No Node frontend (skip npm)
        run: echo "Building a Rust-only Tauri app; skipping npm steps."

      - name: Build backend exe (PyInstaller)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pyinstaller
          # Prepare a non-secret .env as before
          cat > backend/.env << 'EOF'
          OPENAI_API_KEY=
          MODEL_NAME=gpt-4o-mini
          MODEL_TEMPERATURE=0.30
          MAPPING_CSV=question_mapping_template_new.csv
          EXCEL_TEMPLATE=bid checklist.xlsx
          EOF
          pyinstaller \
            --onefile \
            --name scherrer-bid-backend \
            --add-data "backend/.env:." \
            --add-data "question_mapping_template_new.csv:." \
            --add-data "bid checklist.xlsx:." \
            --paths backend \
            backend/run_backend.py

      - name: Copy backend exe into Tauri bundle resources
        shell: bash
        run: |
          mkdir -p src_tauri/resources
          cp dist/scherrer-bid-backend.exe src_tauri/resources/

      - name: Install Windows bundlers (NSIS and WiX)
        shell: powershell
        run: |
          choco install nsis -y
          choco install wixtoolset --version=3.11.2 -y

      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --locked

      - name: Build Tauri app (Rust-only)
        working-directory: src_tauri
        shell: bash
        run: cargo tauri build --verbose

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scherrer-tauri-windows
          path: |
            src_tauri/target/release/bundle/msi/*.msi
            src_tauri/target/release/bundle/nsis/*.exe