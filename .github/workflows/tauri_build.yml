name: Windows Tauri Build

on:
  workflow_dispatch:

jobs:
  build-tauri-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: No Node frontend (skip npm)
        run: echo "Building a Rust-only Tauri app; skipping npm steps."

      - name: Build backend exe (PyInstaller)
        shell: cmd
        run: |
          echo CWD is %CD%
          py -3 -m pip install --upgrade pip
          py -3 -m pip install -r backend/requirements.txt
          py -3 -m pip install pyinstaller

          REM Ensure a minimal non-secret backend .env exists (real secrets are injected at runtime)
          IF NOT EXIST backend\.env (
            echo OPENAI_API_KEY= > backend\.env
            echo MODEL_NAME=gpt-4o-mini>> backend\.env
            echo MODEL_TEMPERATURE=0.30>> backend\.env
          )

          REM Build ONEDIR so the EXE is at dist\scherrer-bid-backend\scherrer-bid-backend.exe
          py -3 -m PyInstaller --noconfirm --onedir --name scherrer-bid-backend backend\run_backend.py

          REM List the PyInstaller onedir output for debugging
          dir dist\scherrer-bid-backend

      - name: Copy backend onedir into Tauri bundle resources
        shell: cmd
        run: |
          REM Ensure target resource folders exist
          IF NOT EXIST frontend\src_tauri\resources mkdir frontend\src_tauri\resources
          IF NOT EXIST frontend\src_tauri\resources\scherrer-bid-backend mkdir frontend\src_tauri\resources\scherrer-bid-backend

          REM Copy the entire PyInstaller ONEDIR output (exe + _internal) into resources/scherrer-bid-backend
          xcopy /E /I /Y dist\scherrer-bid-backend\* frontend\src_tauri\resources\scherrer-bid-backend\

          dir frontend\src_tauri\resources
          dir frontend\src_tauri\resources\scherrer-bid-backend

      - name: Install Windows bundlers (NSIS and WiX)
        shell: powershell
        continue-on-error: true
        run: |
          choco list --local-only

          # Install/upgrade NSIS
          choco upgrade nsis -y --no-progress

          # Try to install WiX 3.11.2; if it fails because it's already installed, upgrade instead
          choco install wixtoolset --version=3.11.2 -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            Write-Host "WiX install failed or newer version already installed. Attempting upgrade..."
            choco upgrade wixtoolset -y --no-progress
            $global:LASTEXITCODE = 0
          }

      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --locked --version "^1.5.0"

      - name: Ensure Windows icon exists (icons/icon.ico)
        working-directory: frontend/src_tauri
        shell: bash
        run: |
          mkdir -p icons
          # Write a minimal BMP-based .ico (32x32, 32bpp, fully transparent). Avoids PNG-in-ICO decoding issues.
          python -c "import struct,pathlib; w=h=32; icondir=struct.pack('<HHH',0,1,1); bi_h=h*2; bmp_hdr=struct.pack('<IiiHHIIiiII',40,w,bi_h,1,32,0,w*h*4,0,0,0,0); pixels=b'\x00'*(w*h*4); row_bytes=((w+31)//32)*4; mask=b'\x00'*(row_bytes*h); bmp=bmp_hdr+pixels+mask; entry=struct.pack('<BBBBHHII',w,h,0,0,1,32,len(bmp),6+16); ico=icondir+entry+bmp; pathlib.Path('icons/icon.ico').write_bytes(ico); print('Wrote icons/icon.ico (%d bytes)'%len(ico))"

          ls -la icons || true

      - name: Ensure frontend dist assets exist
        shell: bash
        run: |
          mkdir -p frontend/dist
          if [ ! -f frontend/dist/index.html ]; then
            if [ -f frontend/index.html ]; then
              cp frontend/index.html frontend/dist/index.html
            else
              printf '%s\n' \
                '<!doctype html>' \
                '<html lang="en">' \
                '  <head>' \
                '    <meta charset="utf-8" />' \
                '    <meta name="viewport" content="width=device-width, initial-scale=1" />' \
                '    <title>Scherrer AI Agent</title>' \
                '  </head>' \
                '  <body>' \
                '    <h1>Scherrer AI Agent</h1>' \
                '  </body>' \
                '</html>' \
                > frontend/dist/index.html
            fi
          fi
          ls -la frontend/dist

      - name: Patch tauri.conf.json for CI (distDir + resources)
        shell: bash
        run: |
          python -c "import json,pathlib; p=pathlib.Path('frontend/src_tauri/tauri.conf.json'); d=json.loads(p.read_text(encoding='utf-8')); d.setdefault('build',{}); d['build']['distDir']='../dist'; d['build']['devPath']='../dist/index.html'; t=d.setdefault('tauri',{}); b=t.setdefault('bundle',{}); res=[r for r in b.get('resources',[]) if not (isinstance(r,str) and ('scherrer-bid-backend' in r))]; res += ['resources/scherrer-bid-backend']; b['resources']=res; b.pop('externalBin', None); p.write_text(json.dumps(d,indent=2),encoding='utf-8'); print('Patched tauri.conf.json (no externalBin)')"

      - name: Show tauri.conf.json after patch
        shell: bash
        run: |
          cat frontend/src_tauri/tauri.conf.json

      - name: Build Tauri app (Rust-only)
        working-directory: frontend/src_tauri
        shell: bash
        run: |
          cargo tauri build --verbose

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scherrer-tauri-windows
          path: |
            frontend/src_tauri/target/release/bundle/msi/*.msi
            frontend/src_tauri/target/release/bundle/nsis/*.exe