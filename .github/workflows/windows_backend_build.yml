name: Windows Backend Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install backend deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pyinstaller

      # Keep secrets OUT of the exe; end users can edit this .env after install.
      - name: Prepare runtime .env (no secrets)
        shell: pwsh
        working-directory: backend
        run: |
          @"
          # Placeholders; end users should edit this on their machine.
          OPENAI_API_KEY=
          MODEL_NAME=gpt-4o-mini
          MODEL_TEMPERATURE=0.30

          # Default asset paths (resolved by paths.py)
          MAPPING_CSV=question_mapping_template_new.csv
          EXCEL_TEMPLATE=bid checklist.xlsx
          "@ | Out-File -FilePath .env -Encoding UTF8 -Force

      - name: Verify inputs exist
        shell: pwsh
        run: |
          gci -Force .
          gci -Force backend

      # IMPORTANT: run under PowerShell and avoid line continuations that break parsing.
      - name: Build exe with PyInstaller
        shell: pwsh
        run: >
          pyinstaller --onefile --name scherrer-bid-backend
          --add-data "backend\.env;."
          --add-data "question_mapping_template_new.csv;."
          --add-data "bid checklist.xlsx;."
          --paths backend backend\run_backend.py

      - name: Upload artifact (exe)
        uses: actions/upload-artifact@v4
        with:
          name: scherrer-bid-backend-win
          path: dist\scherrer-bid-backend.exe
          if-no-files-found: error